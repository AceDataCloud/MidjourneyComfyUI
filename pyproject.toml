[project]
name = "midjourney"
version = "0.1.0"
description = "Midjourney Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/MidjourneyComfyUI"
Documentation = "https://github.com/AceDataCloud/MidjourneyComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/MidjourneyComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Midjourney by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/MidjourneyComfyUI/main/assets/logo-400.png"
